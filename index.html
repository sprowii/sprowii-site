<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sprowii</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="app-frame" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
  const tunnelBase = "https://chastely-enduring-cow.cloudpub.ru";
  const cleanPath = "/" + (window.location.pathname + window.location.search + window.location.hash).replace(/^\/+/, "");
  document.getElementById("app-frame").src = tunnelBase + cleanPath;
  </script>
</body>
</html>
